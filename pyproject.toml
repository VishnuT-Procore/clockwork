[project]
name = "deploytrain"
version = "0.1.0"
description = "Region-by-region production deployment train with configurable time windows"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
deploytrain = "deploytrain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deploytrain"]
