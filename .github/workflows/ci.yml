name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q --junitxml=junit.xml
      - name: Annotate test failures
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("junit.xml").getroot()
          except (OSError, ET.ParseError):
              raise SystemExit(0)
          for case in root.iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  name = f"{case.get('classname')}::{case.get('name')}"
                  detail = (bad.get("message") or "") + "\n" + (bad.text or "")[-1500:]
                  detail = detail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={name}::{detail}")
      - name: Validate example config
        run: traintraintrain -c examples/train.yaml plan

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Wheel contains the web UI
        run: unzip -l dist/*.whl | grep -q "traintraintrain/ui/index.html"
