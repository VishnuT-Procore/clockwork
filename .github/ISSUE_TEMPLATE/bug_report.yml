name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config (redacted)
      description: The relevant part of your train.yaml. Remove hostnames, tokens and anything internal.
      render: yaml
  - type: textarea
    id: output
    attributes:
      label: Output / logs
      description: Output of `deploytrain status --version ... --events 30`, or the run log.
      render: text
  - type: input
    id: version
    attributes:
      label: deploytrain version, Python version and OS
      placeholder: deploytrain 0.1.0, Python 3.12, Ubuntu 24.04
    validations:
      required: true
