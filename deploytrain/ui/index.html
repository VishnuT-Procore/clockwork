<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deploy Train</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --border: #dfe3e8; --text: #1b1f24;
  --muted: #5f6b7a; --accent: #2563eb; --accent-text: #ffffff;
  --gray: #8a94a3; --amber: #b7791f; --blue: #2563eb; --violet: #7c3aed; --green: #15803d;
  --red: #c62828; --orange: #c2410c;
  --gray-bg: #eef0f3; --amber-bg: #fdf3e1; --blue-bg: #e6eefc; --violet-bg: #f0e9fd;
  --green-bg: #e5f4ea; --red-bg: #fbe7e7; --orange-bg: #fdece3;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #171b21; --panel-2: #1e232b; --border: #2b313b; --text: #e6e9ee;
    --muted: #97a1af; --accent: #4f8cff; --accent-text: #0b0d10;
    --gray: #8a94a3; --amber: #f0b44c; --blue: #6aa1ff; --violet: #a98bfa; --green: #4ccb7a;
    --red: #ff6b6b; --orange: #fb923c;
    --gray-bg: #232830; --amber-bg: #3a2e16; --blue-bg: #1a2a47; --violet-bg: #2a2145;
    --green-bg: #15301f; --red-bg: #3d1c1c; --orange-bg: #3b2414;
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
button, input { font: inherit; color: inherit; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
a { color: var(--accent); }

header.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 16px; margin: 0; font-weight: 650; }
header.top .train { color: var(--muted); font-weight: 500; }
header.top .spacer { flex: 1; }
.user-chip { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.user-chip input { width: 130px; padding: 4px 8px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--panel-2); }

.btn { border: 1px solid var(--border); background: var(--panel); padding: 6px 12px; border-radius: 7px;
  cursor: pointer; font-weight: 550; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--border)); }
.btn.danger:hover { background: var(--red-bg); }
.btn.warn { background: var(--amber); border-color: var(--amber); color: #fff; }

.layout { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 53px); }
aside { border-right: 1px solid var(--border); background: var(--panel); padding: 12px; overflow-y: auto;
  height: calc(100vh - 53px); position: sticky; top: 53px; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 14px 6px 6px; }
.nav-item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none;
  padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
.nav-item:hover { background: var(--panel-2); }
.nav-item.active { background: var(--panel-2); border-color: var(--border); }
.nav-item .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nav-item .ver { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
.progress { height: 4px; border-radius: 2px; background: var(--gray-bg); margin-top: 6px; overflow: hidden;
  display: flex; }
.progress span { display: block; height: 100%; }
.empty { color: var(--muted); padding: 8px 10px; font-size: 13px; }

main { padding: 18px 22px 40px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
.dep-head { padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.dep-head .title { font-size: 20px; font-weight: 700; }
.dep-head .meta { color: var(--muted); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
.dep-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.pulse::before { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.s-scheduled, .s-aborted { color: var(--gray); background: var(--gray-bg); }
.s-held, .s-at_signal, .s-interrupted { color: var(--amber); background: var(--amber-bg); }
.s-deploying, .s-en_route, .s-starting { color: var(--blue); background: var(--blue-bg); }
.s-dwelling { color: var(--violet); background: var(--violet-bg); }
.s-succeeded { color: var(--green); background: var(--green-bg); }
.s-failed, .s-rollback_failed { color: var(--red); background: var(--red-bg); }
.s-rolled_back { color: var(--orange); background: var(--orange-bg); }
.bar-succeeded { background: var(--green); } .bar-failed, .bar-rollback_failed { background: var(--red); }
.bar-rolled_back { background: var(--orange); } .bar-deploying { background: var(--blue); }
.bar-dwelling { background: var(--violet); } .bar-held { background: var(--amber); }

.banner { margin-top: 14px; padding: 12px 14px; border-radius: 10px; display: flex; gap: 12px;
  align-items: center; flex-wrap: wrap; border: 1px solid; }
.banner .grow { flex: 1; min-width: 200px; }
.banner.amber { background: var(--amber-bg); border-color: color-mix(in srgb, var(--amber) 35%, transparent); }
.banner.red { background: var(--red-bg); border-color: color-mix(in srgb, var(--red) 35%, transparent); }
.banner.blue { background: var(--blue-bg); border-color: color-mix(in srgb, var(--blue) 35%, transparent); }

.section-title { font-size: 13px; font-weight: 650; margin: 22px 0 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .05em; }
.pipeline { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; align-items: stretch; }
.stop { flex: 1 0 240px; max-width: 360px; display: flex; flex-direction: column; gap: 8px; }
.stop-head { display: flex; align-items: center; gap: 8px; padding: 0 2px; min-height: 26px; }
.stop-head .name { font-weight: 650; }
.stop-head .tags { color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; font-size: 11.5px; }
.arrow { align-self: center; color: var(--muted); font-size: 18px; flex: 0 0 auto; padding-top: 26px; }
.platform { padding: 10px 12px; border-left: 3px solid var(--border); }
.platform.st-succeeded { border-left-color: var(--green); } .platform.st-failed,
.platform.st-rollback_failed { border-left-color: var(--red); } .platform.st-rolled_back { border-left-color: var(--orange); }
.platform.st-deploying { border-left-color: var(--blue); } .platform.st-dwelling { border-left-color: var(--violet); }
.platform.st-held { border-left-color: var(--amber); }
.platform .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.platform .name { font-weight: 600; overflow-wrap: anywhere; }
.platform .msg { color: var(--muted); font-size: 12.5px; margin-top: 5px; overflow-wrap: anywhere; }
.platform .svc { font-size: 12px; margin-top: 6px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
.dot.open { background: var(--green); } .dot.closed { background: var(--gray); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-top: 24px; }
.tab { border: none; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 550; }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.tabpanel { padding-top: 12px; }
.events { list-style: none; margin: 0; padding: 0; }
.events li { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 6px 4px;
  border-bottom: 1px solid var(--border); font-size: 13px; }
.events li:last-child { border-bottom: none; }
.events .t { color: var(--muted); font-size: 12px; }
.events .r { font-weight: 600; margin-right: 6px; }
.events .bad { color: var(--red); }
.platform pre.out { margin: 8px 0 0; padding: 6px 8px; font-size: 11.5px; background: var(--red-bg);
  border-radius: 6px; white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow: auto; }
.tabs .filter { margin-left: auto; align-self: center; font-size: 12.5px; color: var(--muted);
  display: flex; gap: 6px; align-items: center; }
pre.log { background: #0d1117; color: #d6dde6; padding: 12px 14px; border-radius: 10px; overflow: auto;
  max-height: 480px; margin: 0; white-space: pre-wrap; word-break: break-word; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: none; }
.table-wrap { overflow-x: auto; }

dialog { border: 1px solid var(--border); border-radius: 12px; padding: 0; background: var(--panel);
  color: var(--text); width: min(560px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,14,20,.45); }
dialog form { padding: 18px 20px; }
dialog h3 { margin: 0 0 12px; font-size: 17px; }
dialog label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
dialog input[type=text], dialog input[type=password] { width: 100%; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 7px; background: var(--panel-2); }
dialog .hint { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
dialog .check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.tt-preview { margin-top: 14px; max-height: 220px; overflow: auto; border: 1px solid var(--border);
  border-radius: 8px; }

#toasts { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
.toast { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent);
  padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.15); max-width: 380px; }
.toast.error { border-left-color: var(--red); }

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  #departures { display: flex; gap: 6px; overflow-x: auto; }
  #departures .nav-item { min-width: 200px; }
  main { padding: 14px 16px 40px; }
  .pipeline { flex-direction: column; }
  .stop { max-width: none; flex-basis: auto; }
  .arrow { transform: rotate(90deg); padding: 0; }
  .events li { grid-template-columns: 1fr; gap: 2px; }
  .user-chip label { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Deploy Train <span class="train" id="trainName"></span></h1>
  <span class="spacer"></span>
  <div class="user-chip" id="userChip"></div>
  <button class="btn primary" id="departBtn">New departure</button>
</header>

<div class="layout">
  <aside>
    <button class="nav-item" id="overviewNav"><div class="ver">Timetable</div>
      <div class="sub">Service hours and projected arrivals</div></button>
    <h2>Departures</h2>
    <div id="departures"><div class="empty">Loading…</div></div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="departDialog">
  <form method="dialog">
    <h3>New departure</h3>
    <label for="dpVersion">Version to deploy</label>
    <input type="text" id="dpVersion" required pattern="[A-Za-z0-9][A-Za-z0-9._+\-]{0,99}" placeholder="v1.5.0" autocomplete="off">
    <label for="dpPrev">Previous version (rollback target)</label>
    <input type="text" id="dpPrev" pattern="[A-Za-z0-9][A-Za-z0-9._+\-]{0,99}" placeholder="v1.4.0" autocomplete="off">
    <div class="hint">Used by the rollback command if a platform fails.</div>
    <label class="check"><input type="checkbox" id="dpDry"> Dry run (print commands, skip dwell)</label>
    <div class="tt-preview" id="dpTimetable"><div class="empty">Loading timetable…</div></div>
    <div class="buttons">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="ok">Depart</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDialog">
  <form method="dialog">
    <h3 id="cfTitle"></h3>
    <div id="cfBody"></div>
    <div class="buttons">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn primary" value="ok" id="cfOk">Confirm</button>
    </div>
  </form>
</dialog>

<dialog id="tokenDialog">
  <form method="dialog">
    <h3>Access token required</h3>
    <div class="hint">This UI is protected by <code>DEPLOYTRAIN_UI_TOKEN</code>. Ask the operator for the token.</div>
    <label for="tokenInput">Token</label>
    <input type="password" id="tokenInput" autocomplete="off">
    <div class="buttons"><button class="btn primary" value="ok">Save</button></div>
  </form>
</dialog>

<div id="toasts"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const STATUS_LABEL = {
  scheduled: "Scheduled", held: "Held at signal", deploying: "Deploying", dwelling: "Dwelling",
  succeeded: "Succeeded", failed: "Failed", rolled_back: "Rolled back", rollback_failed: "Rollback failed",
  aborted: "Aborted", en_route: "En route", at_signal: "At signal",
  interrupted: "Interrupted", starting: "Departing",
};
const ACTIVE = new Set(["deploying", "dwelling", "en_route", "starting"]);
const pill = (s) => `<span class="pill s-${esc(s)}${ACTIVE.has(s) ? " pulse" : ""}">${esc(STATUS_LABEL[s] || s)}</span>`;

let state = { config: null, departures: [], selected: null, dep: null, tab: "events", whoami: null,
  inflight: false, showChecks: false };

// ---- API ------------------------------------------------------------------
async function api(path, body) {
  const headers = { "X-Deploytrain-User": store.get("dt-user") || "" };
  const token = store.get("dt-token");
  if (token) headers["Authorization"] = "Bearer " + token;
  const opts = { headers };
  if (body !== undefined) {
    opts.method = "POST";
    headers["Content-Type"] = "application/json";
    headers["X-Requested-With"] = "deploytrain";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401) { askToken(); throw new Error("Authentication required"); }
  if (!res.ok) { const e = new Error(data.error || res.statusText); e.status = res.status; throw e; }
  return data;
}

function toast(msg, error = false) {
  const el = document.createElement("div");
  el.className = "toast" + (error ? " error" : "");
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), error ? 7000 : 3500);
}

function askToken() {
  const d = $("tokenDialog");
  if (d.open) return;
  $("tokenInput").value = "";
  d.showModal();
  d.onclose = () => { if ($("tokenInput").value) { store.set("dt-token", $("tokenInput").value); refreshAll(); } };
}

function confirmAction(title, bodyHtml, okLabel, okClass = "primary") {
  return new Promise((resolve) => {
    const d = $("confirmDialog");
    $("cfTitle").textContent = title;
    $("cfBody").innerHTML = bodyHtml;
    $("cfOk").textContent = okLabel;
    $("cfOk").className = "btn " + okClass;
    d.returnValue = "";
    d.onclose = () => resolve(d.returnValue === "ok");
    d.showModal();
  });
}

// ---- time formatting ------------------------------------------------------
function rel(iso) {
  if (!iso) return "";
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  const a = Math.abs(s);
  const f = a < 60 ? `${a}s` : a < 3600 ? `${Math.round(a / 60)}m` : a < 86400 ? `${(a / 3600).toFixed(a < 36000 ? 1 : 0)}h` : `${(a / 86400).toFixed(1)}d`;
  return s >= 0 ? `${f} ago` : `in ${f}`;
}
function dur(fromIso, toIso) {
  if (!fromIso) return "";
  const s = Math.max(0, Math.round(((toIso ? new Date(toIso) : new Date()) - new Date(fromIso)) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`;
}
function fmtTime(iso, tz) {
  if (!iso) return "";
  try {
    return new Intl.DateTimeFormat(undefined, { weekday: "short", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit", timeZone: tz, timeZoneName: tz ? "short" : undefined }).format(new Date(iso));
  } catch { return iso; }
}

// ---- rendering: sidebar -----------------------------------------------------
function depStatus(d) { return d.starting ? "starting" : d.interrupted ? "interrupted" : d.status; }

function renderDepartures() {
  const el = $("departures");
  $("overviewNav").classList.toggle("active", !state.selected);
  if (!state.departures.length) { el.innerHTML = `<div class="empty">No departures yet. Start one with “New departure”.</div>`; return; }
  el.innerHTML = state.departures.map((d) => {
    const segs = ["succeeded", "rolled_back", "failed", "rollback_failed", "dwelling", "deploying", "held"]
      .map((k) => d.counts[k] ? `<span class="bar-${k}" style="width:${(100 * d.counts[k]) / d.total}%"></span>` : "").join("");
    const done = d.counts.succeeded || 0;
    return `<button class="nav-item${state.selected === d.version ? " active" : ""}" data-version="${esc(d.version)}">
      <div class="row"><span class="ver">${esc(d.version)}</span>${pill(depStatus(d))}</div>
      <div class="sub">${done}/${d.total} platforms · departed ${esc(rel(d.started_at))}</div>
      <div class="progress">${segs}</div></button>`;
  }).join("");
  el.querySelectorAll(".nav-item").forEach((b) => b.onclick = () => select(b.dataset.version));
}

// ---- rendering: departure ---------------------------------------------------
function serviceLine(cp, status) {
  if (!cp || ["succeeded", "rolled_back", "held"].includes(status)) return "";
  if (cp.in_service)
    return `<div class="svc"><span class="dot open"></span>${esc(cp.timetable)} in service${cp.service_end ? " until " + esc(fmtTime(cp.service_end, cp.timezone)) : ""}</div>`;
  if (cp.next_start)
    return `<div class="svc"><span class="dot closed"></span>${esc(cp.timetable)} resumes ${esc(fmtTime(cp.next_start, cp.timezone))} (${esc(rel(cp.next_start))})</div>`;
  return `<div class="svc"><span class="dot closed"></span>${esc(cp.timetable)}: no service in the next 90 days</div>`;
}

function signalTag(stop, info) {
  if (!stop.signal) return "";
  const sig = info && info.signal;
  if (sig && sig.status === "cleared")
    return `<span class="tag" title="cleared by ${esc(sig.cleared_by)}">🟢 signal cleared</span>`;
  if (sig && sig.status === "waiting") return `<span class="tag">🔴 signal at danger</span>`;
  return `<span class="tag">🚦 signal</span>`;
}

function renderLine(dep) {
  const cfg = state.config;
  return `<div class="pipeline">` + cfg.stops.map((s, i) => {
    const info = (dep && dep.stops && dep.stops[s.name]) || {};
    const tags = [
      s.parallel_platforms > 1 ? `<span class="tag">${s.parallel_platforms} platforms at once</span>` : "",
      s.headway ? `<span class="tag">headway ${esc(s.headway)}</span>` : "",
      signalTag(s, info),
    ].join("");
    const platforms = s.platforms.map((cp) => {
      const ps = dep ? dep.platforms[cp.name] || { status: "scheduled" } : null;
      const st = ps ? ps.status : null;
      return `<div class="card platform st-${esc(st || "none")}">
        <div class="row"><span class="name">${esc(cp.name)}</span>${st ? pill(st) : `<span class="tag">dwell ${esc(cp.dwell)}</span>`}</div>
        ${ps && ps.message ? `<div class="msg">${esc(ps.message)}</div>` : ""}
        ${ps && ps.output ? `<pre class="out mono">${esc(ps.output)}</pre>` : ""}
        ${ps && ps.started_at ? `<div class="msg">started ${esc(rel(ps.started_at))}${ps.finished_at ? " · took " + esc(dur(ps.started_at, ps.finished_at)) : ""}</div>` : ""}
        ${serviceLine(cp, st)}
      </div>`;
    }).join("");
    return (i ? `<div class="arrow">→</div>` : "") +
      `<div class="stop"><div class="stop-head"><span class="name">${esc(s.name)}</span><span class="tags">${tags}</span></div>${platforms}</div>`;
  }).join("") + `</div>`;
}

function renderEvents(dep) {
  let evs = (dep.events || []).slice().reverse();
  if (!state.showChecks) evs = evs.filter((e) => !/^(\[dry-run\] )?(inspection|health check):/.test(e.message));
  if (!evs.length) return `<div class="empty">No events yet.</div>`;
  return `<ul class="events">` + evs.map((e) => {
    const bad = /FAILED|failed|brake|abort/.test(e.message);
    const where = e.platform || e.region;
    return `<li><span class="t" title="${esc(e.at)}">${esc(fmtTime(e.at))}</span>
      <span>${where ? `<span class="r">${esc(where)}</span>` : ""}<span class="${bad ? "bad" : ""}">${esc(e.message)}</span></span></li>`;
  }).join("") + `</ul>`;
}

const ACTION_LABEL = { depart: "departed", start: "departed", resume: "resumed", brake: "pulled the brake",
  abort: "pulled the brake", clear_signal: "cleared the signal", approve: "cleared the signal" };

function renderActions(dep) {
  const acts = (dep.actions || []).slice().reverse();
  if (!acts.length) return `<div class="empty">No UI actions recorded for this departure.</div>`;
  return `<div class="table-wrap"><table><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr>` +
    acts.map((a) => {
      const { at, user, action, version, ...rest } = a;
      const details = Object.entries(rest).filter(([, v]) => v !== null && v !== false).map(([k, v]) => `${k}=${v}`).join(", ");
      return `<tr><td>${esc(fmtTime(at))}</td><td>${esc(user)}</td><td>${esc(ACTION_LABEL[action] || action)}</td><td>${esc(details)}</td></tr>`;
    }).join("") + `</table></div>`;
}

function renderDeparture() {
  const dep = state.dep;
  const main = $("main");
  if (!dep) { main.innerHTML = `<div class="empty">Loading…</div>`; return; }
  const st = depStatus(dep);
  const enRoute = dep.active;
  const canResume = !dep.starting && !enRoute && ["failed", "aborted", "interrupted"].includes(st);
  const hasFailed = dep.platforms && Object.values(dep.platforms).some((p) => ["failed", "rolled_back", "rollback_failed"].includes(p.status));
  const actions = [
    enRoute ? `<button class="btn danger" data-act="brake" ${dep.brake_applied ? "disabled" : ""}>${dep.brake_applied ? "Braking…" : "Emergency brake"}</button>` : "",
    canResume && hasFailed ? `<button class="btn primary" data-act="retry">Retry failed platforms</button>` : "",
    canResume && !hasFailed ? `<button class="btn primary" data-act="resume">Resume journey</button>` : "",
  ].join("");

  const banners = [];
  if (dep.signal_at) {
    banners.push(`<div class="banner amber"><span class="grow"><strong>🔴 Signal at “${esc(dep.signal_at)}” is at danger.</strong>
      ${dep.signal_clear_submitted ? " Signal cleared, waiting for the train to proceed…" : " Check the earlier stops, then clear the signal to continue."}</span>
      ${dep.signal_clear_submitted ? "" : `<button class="btn warn" data-act="clear-signal">Clear signal at ${esc(dep.signal_at)}</button>`}</div>`);
  }
  if (dep.interrupted) banners.push(`<div class="banner amber"><span class="grow"><strong>The train process stopped unexpectedly.</strong> Its state says it was still en route. Resume the journey to continue from where it left off.</span></div>`);
  if (st === "failed") banners.push(`<div class="banner red"><span class="grow"><strong>Train halted.</strong> Check the failed platform below and the log, fix the issue, then retry the failed platforms.</span></div>`);
  if (dep.starting) banners.push(`<div class="banner blue"><span class="grow">The train is departing…</span></div>`);

  const showLog = state.tab === "log", showActs = state.tab === "actions";
  main.innerHTML = `
    <div class="card dep-head">
      <div><div class="title">${esc(dep.version)}</div>
        <div class="meta">${dep.previous_version ? `<span>rollback target <code>${esc(dep.previous_version)}</code></span>` : ""}
          ${dep.started_at ? `<span title="${esc(dep.started_at)}">departed ${esc(rel(dep.started_at))}</span>` : ""}
          ${dep.started_at ? `<span>journey ${esc(dur(dep.started_at, dep.finished_at))}</span>` : ""}</div></div>
      ${pill(st)}
      <div class="actions">${actions}</div>
    </div>
    ${banners.join("")}
    <div class="section-title">Route</div>
    ${dep.platforms ? renderLine(dep) : ""}
    <div class="tabs">
      <button class="tab ${!showLog && !showActs ? "active" : ""}" data-tab="events">Events</button>
      <button class="tab ${showLog ? "active" : ""}" data-tab="log">Log</button>
      <button class="tab ${showActs ? "active" : ""}" data-tab="actions">Who did what</button>
      ${!showLog && !showActs ? `<label class="filter"><input type="checkbox" id="showChecks" ${state.showChecks ? "checked" : ""}> Show inspections</label>` : ""}
    </div>
    <div class="tabpanel">${showLog ? `<pre class="log" id="logPre">${esc(dep.log || "(no output yet)")}</pre>` : showActs ? renderActions(dep) : dep.events ? renderEvents(dep) : ""}</div>`;

  main.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; renderDeparture(); });
  const sc = $("showChecks");
  if (sc) sc.onchange = () => { state.showChecks = sc.checked; renderDeparture(); };
  main.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => doAction(b.dataset.act));
  const pre = $("logPre");
  if (pre) pre.scrollTop = pre.scrollHeight;
}

// ---- rendering: timetable overview -------------------------------------------
async function renderOverview() {
  const main = $("main");
  let projRows = "";
  try {
    const t = await api("/api/timetable");
    projRows = t.stops.flatMap((s) => s.platforms.map((p) =>
      `<tr><td>${esc(s.name)}</td><td>${esc(p.name)}</td><td>${esc(fmtTime(p.start))}</td><td>${esc(fmtTime(p.end))}</td><td>${esc(p.held || "–")}</td></tr>`)).join("");
  } catch (e) { projRows = `<tr><td colspan="5">${esc(e.message)}</td></tr>`; }
  if (state.selected) return; // user navigated away while loading
  const rows = state.config.stops.flatMap((s) => s.platforms.map((p) => `<tr>
      <td>${esc(s.name)}</td><td><strong>${esc(p.name)}</strong></td><td>${esc(p.timetable)}<div class="msg">${esc(p.timezone)}</div></td>
      <td>${p.in_service ? `<span class="pill s-succeeded">In service</span>` : `<span class="pill s-scheduled">No service</span>`}</td>
      <td>${p.in_service ? (p.service_end ? "until " + esc(fmtTime(p.service_end, p.timezone)) : "") : p.next_start ? esc(fmtTime(p.next_start, p.timezone)) + `<div class="msg">${esc(rel(p.next_start))}</div>` : "none in 90 days"}</td>
      <td>${esc(p.dwell)}</td></tr>`)).join("");
  main.innerHTML = `
    <div class="card dep-head"><div><div class="title">Timetable</div>
      <div class="meta"><span>rollback scope: ${esc(state.config.rollback_scope)}</span><span>Slack: ${state.config.slack ? "on" : "off"}</span></div></div></div>
    <div class="section-title">Route</div>
    ${renderLine(null)}
    <div class="section-title">Service right now</div>
    <div class="card table-wrap"><table><tr><th>Stop</th><th>Platform</th><th>Timetable</th><th>Now</th><th>Next change</th><th>Dwell</th></tr>${rows}</table></div>
    <div class="section-title">If a train departed now (projected)</div>
    <div class="card table-wrap"><table><tr><th>Stop</th><th>Platform</th><th>Departs</th><th>Done</th><th>Held</th></tr>${projRows}</table></div>`;
}

// ---- actions ----------------------------------------------------------------
async function doAction(act) {
  const dep = state.dep;
  const v = esc(dep.version);
  let ok, call;
  if (act === "brake") {
    ok = await confirmAction(`Pull the emergency brake on ${dep.version}?`, `<p>The train stops at its next checkpoint (within a few seconds). Platforms that are mid-deploy are marked aborted. Nothing is rolled back automatically. You can resume the journey later.</p>`, "Pull the brake", "danger");
    call = () => api("/api/departures/brake", { version: dep.version });
  } else if (act === "clear-signal") {
    const s = dep.signal_at;
    const platforms = state.config.stops.find((x) => x.name === s)?.platforms.map((p) => p.name).join(", ");
    ok = await confirmAction(`Clear the signal at “${s}”?`, `<p>This lets <strong>${v}</strong> proceed to: <strong>${esc(platforms)}</strong>.</p><p class="hint">Recorded as cleared by <strong>${esc(state.whoami?.user || "anonymous")}</strong>.</p>`, "Clear signal", "warn");
    call = () => api("/api/departures/clear-signal", { version: dep.version, stop: s });
  } else if (act === "resume" || act === "retry") {
    const retry = act === "retry";
    ok = await confirmAction(retry ? `Retry failed platforms of ${dep.version}?` : `Resume ${dep.version}?`,
      `<p>Platforms that already succeeded are skipped. ${retry ? "Failed and rolled-back platforms are deployed again." : ""}</p>`, retry ? "Retry" : "Resume");
    call = () => api("/api/departures/resume", { version: dep.version, retry_failed: retry });
  }
  if (!ok) return;
  try { await call(); toast("Done."); } catch (e) { toast(e.message, true); }
  refreshAll();
}

async function openDepart() {
  const d = $("departDialog");
  $("dpVersion").value = "";
  const lastGood = state.departures.find((x) => x.status === "succeeded");
  $("dpPrev").value = lastGood ? lastGood.version : "";
  $("dpDry").checked = false;
  d.returnValue = "";
  d.showModal();
  $("dpVersion").focus();
  try {
    const t = await api("/api/timetable");
    $("dpTimetable").innerHTML = `<table><tr><th>Stop</th><th>Platform</th><th>Projected departure</th></tr>` +
      t.stops.flatMap((s) => s.platforms.map((p) => `<tr><td>${esc(s.name)}</td><td>${esc(p.name)}</td><td>${esc(fmtTime(p.start))}</td></tr>`)).join("") + `</table>`;
  } catch (e) { $("dpTimetable").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

$("departDialog").addEventListener("close", async () => {
  if ($("departDialog").returnValue !== "ok") return;
  const version = $("dpVersion").value.trim();
  try {
    await api("/api/departures/depart", { version, previous_version: $("dpPrev").value.trim() || null, dry_run: $("dpDry").checked });
    toast(`${version} departed`);
    select(version);
  } catch (e) { toast(e.message, true); }
});

// ---- navigation & polling ---------------------------------------------------
function hashVersion() {
  const m = location.hash.match(/(?:departure|run)=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

function select(version) {
  state.selected = version || null;
  state.dep = null;
  state.tab = "events";
  history.replaceState(null, "", version ? "#departure=" + encodeURIComponent(version) : "#");
  renderDepartures();
  if (version) { renderDeparture(); refreshDeparture(); } else renderOverview();
}

async function refreshDeparture() {
  if (!state.selected) return;
  const v = state.selected;
  try {
    const dep = await api("/api/departure?version=" + encodeURIComponent(v));
    if (state.selected !== v) return;
    state.dep = dep;
    // Don't re-render while a dialog is open or text is selected (keeps the UI usable).
    if (!document.querySelector("dialog[open]") && !String(window.getSelection())) renderDeparture();
  } catch (e) {
    if (e.status === 404) { state.dep = { version: v, starting: true, log: "" }; renderDeparture(); }
  }
}

async function refreshAll() {
  if (state.inflight) return;
  state.inflight = true;
  try {
    const [config, departures] = await Promise.all([api("/api/config"), api("/api/departures")]);
    state.config = config;
    state.departures = departures;
    $("trainName").textContent = "· " + config.train;
    renderDepartures();
    if (state.selected) await refreshDeparture();
    else if (!document.querySelector("dialog[open]")) await renderOverview();
  } catch (e) {
    if (!/Authentication/.test(e.message)) toast("Can't reach the deploytrain server: " + e.message, true);
  } finally { state.inflight = false; }
}

async function initUser() {
  try { state.whoami = await api("/api/whoami"); } catch { return; }
  const chip = $("userChip");
  const viaProxy = state.whoami.user !== "anonymous" && state.whoami.user !== (store.get("dt-user") || "");
  if (viaProxy) { chip.textContent = "Signed in as " + state.whoami.user; return; }
  chip.innerHTML = `<label for="userName">You:</label><input id="userName" placeholder="your name" value="${esc(store.get("dt-user") || "")}">`;
  $("userName").onchange = async (e) => { store.set("dt-user", e.target.value.trim()); state.whoami = await api("/api/whoami"); };
}

$("departBtn").onclick = openDepart;
$("overviewNav").onclick = () => select(null);
window.addEventListener("hashchange", () => {
  const v = hashVersion();
  if (v !== state.selected) select(v);
});

(async function init() {
  state.selected = hashVersion();
  await initUser();
  await refreshAll();
  setInterval(refreshAll, 4000);
})();
</script>
</body>
</html>
