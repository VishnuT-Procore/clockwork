# Example deployment train.
#
# The train calls at each *stop* in order. A stop serves one or more *platforms*
# (regions, clusters, ...). Each platform follows a *timetable*: deploys only start
# during its service hours, which are local to the timetable's timezone.
train:
  name: api-service
  # Templated with {train} {platform} {stop} {version} {previous_version} and any platform `vars`.
  # The same values are exported as env vars: DT_PLATFORM, DT_STOP, DT_VERSION, DT_CLUSTER, ...
  # Use {{ and }} for literal braces.
  deploy_command: "scripts/deploy.sh {platform} {version} {cluster}"
  inspection_command: "scripts/health.sh {platform}"   # health check run while dwelling
  rollback_command: "scripts/rollback.sh {platform} {previous_version}"
  # What's in this release: a compare link and/or a command listing the changes. Both use
  # {version}, {previous_version} and {train}; the command runs once when a train departs.
  changes:
    url: "https://github.com/acme/api-service/compare/{previous_version}...{version}"
    # command: "git -C /repos/api-service log --oneline {previous_version}..{version}"
  # Optional: ask each platform which version it runs (last line of output), so hotfixes
  # made outside traintraintrain are noticed. Gets the platform's vars, e.g. {cluster}.
  # live_version_command: "kubectl --context {cluster} get deploy api -o jsonpath='{{.metadata.labels.version}}'"
  # Track each platform by the commit it runs instead of the version name (default: tag).
  # track_versions_by: sha
  # resolve_command: "git -C /repos/api-service rev-parse {version}^{{commit}}"
  inspection_interval: 2m         # how often to inspect while dwelling
  default_dwell: 30m              # how long to watch a platform after deploying
  deploy_timeout: 45m
  estimated_deploy_duration: 15m  # only used by `traintraintrain timetable`
  max_hold: 3d                    # fail a platform if it would be held at a signal longer than this
  default_timetable: business-us
  rollback_scope: platform        # none | platform | stop | train
  line_closures:                  # apply to every timetable
    - start: 2026-12-21
      end: 2027-01-02             # inclusive date
      reason: holiday change freeze

notifications:
  slack:
    # Option A (recommended): bot token -> one live-updating message per train, details in its thread.
    #   Create a Slack app with the chat:write scope, invite it to the channel, export SLACK_BOT_TOKEN.
    channel: "#deploys"
    token_env: SLACK_BOT_TOKEN
    # Option B: incoming webhook -> one message per event. Export SLACK_WEBHOOK_URL.
    webhook_url_env: SLACK_WEBHOOK_URL
    mention_on_failure: "<!here>"   # or a user group: "<!subteam^S0123ABCD>"
    ui_url: https://traintraintrain.internal.example.com  # links signal messages to the web UI
    # Which events to post (default: all except platform_deploying):
    # events: [train_started, train_resumed, train_finished, stop_started, stop_completed,
    #          stop_at_signal, signal_cleared, platform_held, platform_deploying,
    #          platform_succeeded, platform_failed, platform_rolled_back]

timetables:
  business-us:
    timezone: America/New_York
    min_remaining: 1h             # don't start a deploy with < 1h of service left
    service_hours:
      - days: mon-thu
        start: "09:00"
        end: "16:00"
  business-eu:
    timezone: Europe/Dublin
    min_remaining: 1h
    service_hours:
      - days: mon-thu
        start: "09:00"
        end: "16:00"
    line_closures:
      - start: 2026-11-05T00:00
        end: 2026-11-05T23:59
        reason: EU marketing launch
  business-apac:
    timezone: Asia/Tokyo
    min_remaining: 1h
    service_hours:
      - days: [mon, tue, wed, thu]
        start: "10:00"
        end: "17:00"
  off-peak-us:
    timezone: America/Los_Angeles
    min_remaining: 2h
    service_hours:
      - days: sun-thu             # overnight service crossing midnight
        start: "22:00"
        end: "05:00"

stops:
  - name: canary
    platforms:
      - name: us-west-2-canary
        timetable: off-peak-us
        dwell: 2h
        vars: {cluster: canary-1}
  - name: pilot
    headway: 1h                   # minimum gap after the canary stop completes
    platforms:
      - name: us-west-2
        vars: {cluster: prod-usw2}
  - name: atlantic
    signal: true                  # someone must clear the signal (web UI or `traintraintrain clear-signal`)
    parallel_platforms: 2
    dwell: 1h
    platforms:
      - name: us-east-1
        vars: {cluster: prod-use1}
      - name: eu-west-1
        timetable: business-eu
        vars: {cluster: prod-euw1}
  - name: worldwide
    parallel_platforms: 3
    platforms:
      - name: eu-central-1
        timetable: business-eu
        vars: {cluster: prod-euc1}
      - name: ap-northeast-1
        timetable: business-apac
        vars: {cluster: prod-apne1}
      - name: ap-southeast-2
        timetable: business-apac
        vars: {cluster: prod-apse2}
