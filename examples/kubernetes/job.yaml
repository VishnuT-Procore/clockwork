# One train as a Kubernetes Job, e.g. created by your CD pipeline for each release.
#
#   VERSION=v1.4.0 PREVIOUS=v1.3.2 envsubst < job.yaml | kubectl apply -f -
#
# The Job ends when the train arrives (exit 0) or fails / is braked (exit 1). It is not
# retried automatically (backoffLimit: 0): fix the cause, then re-create the Job with
# `--retry-failed` added to resume where it stopped.
#
# Uses its own state volume. Don't mount the UI's ReadWriteOnce volume here; if you want
# Jobs and the UI to share state, use a ReadWriteMany volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deploytrain-jobs-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: deploytrain-${VERSION}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 604800   # 7 days: trains can wait for service hours
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: deploytrain
          image: ghcr.io/vishnut-procore/deploytrain:0.1.0   # or your image with tools
          args: ["depart", "--version", "${VERSION}", "--previous-version", "${PREVIOUS}"]
          envFrom:
            - secretRef: {name: deploytrain, optional: true}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - name: config
          configMap: {name: deploytrain-config}
        - name: state
          persistentVolumeClaim: {claimName: deploytrain-jobs-state}
